name: Hybrid event-factor diagnostics

on:
  push:
    branches:
      - diagnostic/hybrid-event-factors

jobs:
  geometry:
    strategy:
      fail-fast: false
      matrix:
        case: [m8, m12, m16, m24, myotis, pcm8]
    name: ${{ matrix.case }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/hybrid-event-factors
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups --python 3.12
      - name: Patch hybrid event factors
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          path = Path("src/acoustic_self_calibration/pipeline.py")
          text = path.read_text()

          start = text.index("    selected: list[int] = []\n")
          end = text.index("\n    if len(selected) != microphone_count - 1:", start)
          body = dedent("""\
          star_candidates: list[tuple[float, list[int]]] = []
          for reference in range(microphone_count):
              star_columns: list[int] = []
              for microphone in range(microphone_count):
                  if microphone == reference:
                      continue
                  for column, (a, b) in enumerate(measurements.microphone_pairs):
                      if {a, b} == {reference, microphone}:
                          star_columns.append(column)
                          break
                  else:
                      star_columns.clear()
                      break
              if len(star_columns) == microphone_count - 1:
                  score = float(np.mean(values[:, star_columns] ** 2))
                  star_candidates.append((score, star_columns))

          selected: list[int] = (
              min(star_candidates, key=lambda item: item[0])[1] if star_candidates else []
          )
          if not selected:
              edge_order = np.argsort(np.mean(values * values, axis=0), kind="stable")
              for column_value in edge_order:
                  column = int(column_value)
                  a, b = measurements.microphone_pairs[column]
                  root_a = find(a)
                  root_b = find(b)
                  if root_a == root_b:
                      continue
                  parent[root_b] = root_a
                  selected.append(column)
                  if len(selected) == microphone_count - 1:
                      break
          """)
          replacement = indent(body, "    ").rstrip("\n")
          text = text[:start] + replacement + text[end:]

          old = '''    # Pairwise event TDOAs share per-channel arrival estimates, so cycle edges are
          # correlated observations. Retain the redundant graph for coarse MDS candidate
          # construction, but use the minimum-uncertainty independent tree for both the
          # continuation preview and the final MAP objective.
          solver_measurements = preview_measurements
          solver_sigma = preview_sigma
          '''
          new = '''    # Small arrays are most sensitive to cycle-overcounting in the diagonal-noise
          # MAP model, so keep an independent reference star through final refinement.
          # Larger arrays have enough geometric redundancy that the normalized redundant
          # graph converges more reliably under the requested robust likelihood.
          if microphone_count <= 12:
              solver_measurements = preview_measurements
              solver_sigma = preview_sigma
          else:
              independent_edge_count = microphone_count - 1
              redundant_edge_count = len(measurements.microphone_pairs)
              redundancy_scale = np.sqrt(redundant_edge_count / independent_edge_count)
              solver_measurements = measurements
              solver_sigma = np.asarray(sigma, dtype=float) * redundancy_scale
          '''
          if old not in text:
              raise SystemExit("expected final-MAP factor block not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
          compile(path.read_text(), str(path), "exec")
          PY
      - name: Run focused regression
        shell: bash
        run: |
          case "${{ matrix.case }}" in
            m8) uv run pytest -q 'tests/test_end_to_end_audio.py::test_event_pipeline_self_calibrates_rendered_pulsed_source[8]' ;;
            m12) uv run pytest -q 'tests/test_end_to_end_audio.py::test_event_pipeline_self_calibrates_rendered_pulsed_source[12]' ;;
            m16) uv run pytest -q 'tests/test_end_to_end_audio.py::test_event_pipeline_self_calibrates_rendered_pulsed_source[16]' ;;
            m24) uv run pytest -q 'tests/test_end_to_end_audio.py::test_event_pipeline_self_calibrates_rendered_pulsed_source[24]' ;;
            myotis) uv run pytest -q tests/test_end_to_end_audio.py::test_event_pipeline_self_calibrates_myotis_planar_layout ;;
            pcm8) uv run pytest -q tests/test_end_to_end_audio.py::test_pcm16_pulsed_wav_pipeline_returns_joint_position_uncertainty ;;
          esac
