name: Try independent-edge final MAP

on:
  push:
    branches:
      - feature/event-driven-calibration

permissions:
  contents: write

jobs:
  focused-geometry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/event-driven-calibration
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv python install "3.12"
      - run: uv sync --locked --all-groups --python "3.12"
      - name: Patch final MAP factorization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/acoustic_self_calibration/pipeline.py")
          text = path.read_text()
          old = '''    independent_edge_count = microphone_count - 1
              redundant_edge_count = len(measurements.microphone_pairs)
              redundancy_scale = np.sqrt(redundant_edge_count / independent_edge_count)
              solver_measurements = measurements
              solver_sigma = np.asarray(sigma, dtype=float) * redundancy_scale
          '''
          # account for exact source indentation without relying on tabs
          old = old.replace("              ", "    ")
          new = '''    # Pairwise event TDOAs are derived from the same per-channel arrival delays.
              # Cycles are therefore correlated observations, and a scalar normalization of
              # the redundant graph cannot reproduce their covariance. Use the independent
              # spanning-tree factors for the final MAP as well as for basin previews.
              solver_measurements = preview_measurements
              solver_sigma = preview_sigma
          '''.replace("              ", "    ")
          if old not in text:
              raise SystemExit("expected solver measurement block not found")
          text = text.replace(old, new, 1)

          old_call = '''                measurements.arrival_delays_s,
              solver_measurements.tdoa_s,
              solver_sigma,
              solver_measurements.microphone_pairs,
          '''.replace("              ", "    ")
          new_call = '''                measurements.arrival_delays_s,
              measurements.tdoa_s,
              sigma,
              measurements.microphone_pairs,
          '''.replace("              ", "    ")
          if old_call not in text:
              raise SystemExit("expected baseline initializer block not found")
          text = text.replace(old_call, new_call, 1)
          path.write_text(text)
          PY
      - name: Focused geometry regressions
        run: >-
          uv run pytest -q
          'tests/test_end_to_end_audio.py::test_event_pipeline_self_calibrates_rendered_pulsed_source[8]'
          tests/test_end_to_end_audio.py::test_event_pipeline_self_calibrates_myotis_planar_layout
          tests/test_end_to_end_audio.py::test_pcm16_pulsed_wav_pipeline_returns_joint_position_uncertainty
      - name: Commit successful experiment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/acoustic_self_calibration/pipeline.py
          git commit -m "Use independent event factors in final MAP"
          git push origin HEAD:feature/event-driven-calibration
