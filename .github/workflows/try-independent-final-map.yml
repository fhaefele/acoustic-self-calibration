name: Try independent-edge final MAP

on:
  push:
    branches:
      - feature/event-driven-calibration

permissions:
  contents: write

jobs:
  focused-geometry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/event-driven-calibration
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv python install "3.12"
      - run: uv sync --locked --all-groups --python "3.12"
      - name: Patch final MAP factorization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/acoustic_self_calibration/pipeline.py")
          text = path.read_text()
          marker = "    preview_budget = min(max_nfev, 250)\n"
          replacement = """    # Pairwise event TDOAs come from shared per-channel arrival delays, so
    # cycles are correlated observations. A scalar normalization of the redundant
    # graph cannot reproduce that covariance. Keep the redundant graph for coarse
    # MDS initialization, but use independent spanning-tree factors for MAP.
    solver_measurements = preview_measurements
    solver_sigma = preview_sigma

    preview_budget = min(max_nfev, 250)
"""
          if text.count(marker) != 1:
              raise SystemExit("expected preview budget marker not found exactly once")
          path.write_text(text.replace(marker, replacement, 1))
          PY
      - name: Focused geometry regressions
        run: >-
          uv run pytest -q
          'tests/test_end_to_end_audio.py::test_event_pipeline_self_calibrates_rendered_pulsed_source[8]'
          tests/test_end_to_end_audio.py::test_event_pipeline_self_calibrates_myotis_planar_layout
          tests/test_end_to_end_audio.py::test_pcm16_pulsed_wav_pipeline_returns_joint_position_uncertainty
      - name: Commit successful experiment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/acoustic_self_calibration/pipeline.py
          git commit -m "Use independent event factors in final MAP"
          git push origin HEAD:feature/event-driven-calibration
