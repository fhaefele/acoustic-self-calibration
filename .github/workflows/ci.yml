name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      full_acceptance:
        description: Run the complete chirp matrix and strict Myotis acceptance
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Sync project
        run: uv sync --locked --all-groups --python "${{ matrix.python-version }}"

      - name: CLI smoke test
        run: |
          uv run asc --help
          uv run asc calibrate --help
          uv run asc check --help
          uv run asc compare --help

      - name: Ruff format check
        if: matrix.python-version == '3.12'
        run: uv run ruff format --check .

      - name: Ruff lint
        if: matrix.python-version == '3.12'
        run: uv run ruff check .

      - name: Ty type check
        if: matrix.python-version == '3.12'
        run: uv run ty check src tests examples

      - name: Tests
        run: uv run pytest

      - name: Build package
        if: matrix.python-version == '3.12'
        run: uv build

  chirp-acceptance:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Direct chirp acceptance
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv sync --locked --all-groups --python 3.12
      - name: Exact and clean chirp subset
        run: uv run python benchmarks/run_chirp_matrix.py --suite pr --workers 2 --output results/chirp_pr.json
      - name: Full held-out evaluation
        if: github.event_name == 'workflow_dispatch' && inputs.full_acceptance
        run: uv run python benchmarks/run_chirp_matrix.py --suite evaluation --workers 2 --output results/chirp_evaluation.json
      - name: Strict public Myotis acceptance
        if: always() && github.event_name == 'workflow_dispatch' && inputs.full_acceptance
        run: uv run python examples/validate_myotis_public.py --output results/myotis_public.json
      - name: Archive outcomes including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chirp-acceptance
          path: results/*.json
