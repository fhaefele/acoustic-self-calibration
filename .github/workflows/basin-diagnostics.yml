name: Basin diagnostics

on:
  push:
    branches:
      - feature/event-driven-calibration

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: global
            kind: global
            args: ""
          - label: subsets
            kind: subset
            args: ""
          - label: baseline-1.0
            kind: baseline
            args: "--scale 1.0"
          - label: baseline-1.25
            kind: baseline
            args: "--scale 1.25"
          - label: baseline-1.6
            kind: baseline
            args: "--scale 1.6"
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv python install "3.12"
      - run: uv sync --locked --all-groups --python "3.12"
      - run: uv run python tools/basin_diagnostic.py ${{ matrix.kind }} ${{ matrix.args }}
