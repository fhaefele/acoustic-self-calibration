name: Export workspace

on:
  push:
    branches: [feature/event-driven-calibration]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pack workspace
        run: tar --exclude=.git -czf "$RUNNER_TEMP/workspace.tgz" .

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: acoustic-self-calibration-workspace
          path: ${{ runner.temp }}/workspace.tgz
          retention-days: 1
