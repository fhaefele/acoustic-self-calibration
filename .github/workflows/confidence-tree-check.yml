name: Confidence tree check
on:
  push:
    branches: [feature/event-driven-calibration]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/event-driven-calibration
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups --python 3.12
      - run: python -c "from pathlib import Path; p=Path('src/acoustic_self_calibration/pipeline.py'); t=p.read_text(); o='    selected: list[int] = []\\n    for column, (a, b) in enumerate(measurements.microphone_pairs):\\n'; n='    selected: list[int] = []\\n    edge_order = np.argsort(np.mean(values * values, axis=0), kind=\"stable\")\\n    for column_value in edge_order:\\n        column = int(column_value)\\n        a, b = measurements.microphone_pairs[column]\\n'; assert t.count(o)==1; p.write_text(t.replace(o,n,1))"
      - run: python -c "from pathlib import Path; p=Path('src/acoustic_self_calibration/pipeline.py'); t=p.read_text(); m='    preview_budget = min(max_nfev, 250)\\n'; r='    solver_measurements = preview_measurements\\n    solver_sigma = preview_sigma\\n\\n'+m; assert t.count(m)==1; p.write_text(t.replace(m,r,1))"
      - run: uv run pytest -q 'tests/test_end_to_end_audio.py::test_event_pipeline_self_calibrates_rendered_pulsed_source[8]' tests/test_end_to_end_audio.py::test_event_pipeline_self_calibrates_myotis_planar_layout tests/test_end_to_end_audio.py::test_pcm16_pulsed_wav_pipeline_returns_joint_position_uncertainty
