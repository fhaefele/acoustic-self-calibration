name: Format event branch

on:
  push:
    branches:
      - feature/event-driven-calibration
    paths:
      - .github/workflows/format-event-branch.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.15"
      - run: uv sync --locked --all-groups
      - run: uv run ruff format src tests examples
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-event-branch.yml
          git add src tests examples
          git diff --cached --quiet || git commit -m "Format event calibration implementation"
          git push
