name: Planar MDS seed diagnostics

on:
  push:
    branches: [diagnostic/planar-mds-seeds]

jobs:
  seed:
    strategy:
      fail-fast: false
      matrix:
        scale: [0.6, 0.8, 0.9, 1.0, 1.15, 1.3, 1.5]
    name: scale-${{ matrix.scale }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/planar-mds-seeds
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups --python 3.12
      - run: uv run python tools/actual_myotis_planar_mds.py '${{ matrix.scale }}'
