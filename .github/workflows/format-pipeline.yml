name: Format pipeline
on:
  push:
    branches: [feature/event-driven-calibration]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/event-driven-calibration
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups --python 3.12
      - run: uv run ruff format src/acoustic_self_calibration/pipeline.py
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/acoustic_self_calibration/pipeline.py
            git commit -m "Format minimum-uncertainty TDOA update"
            git push origin HEAD:feature/event-driven-calibration
          fi
