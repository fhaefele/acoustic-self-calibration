name: Actual Myotis rereferenced low-rank diagnostics

on:
  push:
    branches: [diagnostic/full-myotis-trace]

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: global
            kind: global
            index: 0
          - label: subset-0
            kind: subset
            index: 0
          - label: subset-1
            kind: subset
            index: 1
          - label: subset-2
            kind: subset
            index: 2
          - label: subset-3
            kind: subset
            index: 3
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/full-myotis-trace
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups --python 3.12
      - run: PYTHONPATH=. uv run python tools/actual_myotis_reref_lowrank.py '${{ matrix.kind }}' '${{ matrix.index }}'
