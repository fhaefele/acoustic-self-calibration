[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-self-calibration"
version = "0.5.0"
description = "Bayesian 3D acoustic self-calibration from a moving broadband source"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Felix T. Häfele"}]
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[project.scripts]
asc = "acoustic_self_calibration.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.81",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
acoustic_self_calibration = ["py.typed"]
